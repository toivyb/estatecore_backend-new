services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: estatecore
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: estatecore
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      ESTATECORE_ENV: development
      SECRET_KEY: local-development-only
      JWT_SECRET_KEY: local-development-only
      DATABASE_URL: postgresql://estatecore:local-development-only@db:5432/estatecore
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      - db
    ports:
      - "5000:5000"

volumes:
  postgres_data:
