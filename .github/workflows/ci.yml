name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: estatecore
          POSTGRES_PASSWORD: estatecore-test
          POSTGRES_DB: estatecore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estatecore -d estatecore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://estatecore:estatecore-test@localhost:5432/estatecore_test
      SECRET_KEY: test-secret-that-is-at-least-32-bytes
      JWT_SECRET_KEY: jwt-test-secret-that-is-at-least-32-bytes
      LPR_INTEGRATION_KEY: lpr-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: flask --app wsgi:app db upgrade
      - run: python -m pytest -q tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estatecore_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
