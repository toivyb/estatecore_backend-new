services:
  - type: web
    name: estatecore-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi:app db upgrade && gunicorn wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: ESTATECORE_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: estatecore-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: ESTATECORE_ADMIN_EMAIL
        value: toivybraun@gmail.com
      - key: ESTATECORE_ADMIN_PASSWORD
        sync: false

databases:
  - name: estatecore-db
    databaseName: estatecore
    user: estatecore_user
